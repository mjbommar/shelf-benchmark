tasks:
  retrieval:
  - lcc_retrieval
  - form_retrieval
  - category_retrieval
  classification:
  - lcc_classification
  - lcgft_category_classification
  - register_classification
  clustering:
  - lcc_clustering
  - lcgft_clustering
  - register_clustering
  - geographic_clustering
  pair_classification:
  - same_lcc_pairs
  - same_form_pairs
  - same_register_pairs
  - same_audience_pairs
  - same_topic_pairs
  - topic_overlap_pairs
evaluation:
  max_queries: null
  batch_size: 32
  show_progress: true
  classification_heads:
  - logistic_regression
  - random_forest
  compute_ci: true
  stratify_by:
  - lcgft_category
  - register
  - model
output:
  base_dir: results
  save_individual: true
  save_summary: true
  generate_tables: true
model_groups:
  sparse:
    name: Sparse Baselines
    models:
    - tf
    - tfidf
    - bm25
  small_dense:
    name: Small Dense (< 50M)
    models:
    - minilm
    - bge_small
    - e5_small
    - gte_small
  base_dense:
    name: Base Dense (~110M)
    models:
    - mpnet
    - bge_base
    - e5_base
    - gte_base
    - gtr_t5_base
    - instructor_base
  large_dense:
    name: Large Dense (> 300M)
    models:
    - bge_large
    - e5_large
    - gtr_t5_large
  reference:
    name: Reference Models
    models:
    - bert
    - roberta
shelf_score:
  weights:
    retrieval: 0.3
    classification: 0.25
    clustering: 0.2
    pair_classification: 0.25
  metrics:
    retrieval: ndcg@10
    classification: macro_f1
    clustering: v_measure
    pair_classification: f1
