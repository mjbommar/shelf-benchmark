tasks:
  retrieval:
  - lcc_retrieval
  - form_retrieval
  - category_retrieval
  - instruction_same_subject_diff_form
  - instruction_same_form_diff_subject
  - instruction_same_topic_diff_subject
  - instruction_same_audience_diff_register
  classification:
  - lcc_classification
  # v0.4 Phase 2 difficulty tier: 80 LCC subclasses. `lcc_classification` is
  # lexically saturated (TF-IDF+LR 0.892 macro-F1, 0.754 on 22-word documents),
  # so this measures the within-domain discrimination -- QA vs QC vs QH, KF vs
  # KZ -- that domain vocabulary alone cannot supply. Requires a corpus with a
  # populated `lcc_subclass` field; every v0.3.1 document leaves it empty.
  - lcc_subclass_classification
  - form_classification
  - lcgft_category_classification
  - register_classification
  multilabel:
  - topic_classification
  clustering:
  - lcc_clustering
  - lcgft_clustering
  - register_clustering
  - geographic_clustering
  # Subject-conditional variant: clusters within each LCC class so geography is
  # measured with the dominant variance factor held constant. Reports pooled,
  # chance-corrected ARI (see registry.py for the shuffled-label control).
  - geographic_clustering_conditional
  pair_classification:
  - same_lcc_pairs
  - same_form_pairs
  - same_register_pairs
  - same_audience_pairs
  - same_topic_pairs
  - topic_overlap_pairs
evaluation:
  max_queries: null
  batch_size: 32
  show_progress: true
  classification_heads:
  - logistic_regression
  - random_forest
  compute_ci: true
  stratify_by:
  - lcgft_category
  - register
  - model
output:
  base_dir: results
  save_individual: true
  save_summary: true
  generate_tables: true
model_groups:
  sparse:
    name: Sparse Baselines
    models:
    - tf
    - tfidf
    - bm25
  small_dense:
    name: Small Dense (< 50M)
    models:
    - minilm
    - bge_small
    - e5_small
    - gte_small
  base_dense:
    name: Base Dense (~110M)
    models:
    - mpnet
    - bge_base
    - e5_base
    - gte_base
    - gtr_t5_base
    - instructor_base
  large_dense:
    name: Large Dense (> 300M)
    models:
    - bge_large
    - e5_large
    - gtr_t5_large
  reference:
    name: Reference Models
    models:
    - bert
    - roberta
shelf_score:
  # Tasks that run and are reported, but are deliberately kept OUT of the
  # aggregate. The four instruction-retrieval tasks are TaskType.RETRIEVAL, so
  # without this they would silently turn the retrieval average from 3 tasks
  # into 7 and move every model's score. They also measure a different
  # capability, and two of them are not yet demonstrated to measure
  # instruction-following at all (a lexical baseline wins on both). Report them
  # on their own; fold them in only once that is settled.
  exclude_tasks:
  # Register clustering is a measured NULL, not a defect awaiting a fix.
  # Holding subject constant does not move it: pooled ARI 0.0010 against a flat
  # baseline of 0.0013, per-class ARI ranging -0.004 to 0.054. Reported so the
  # negative result stays visible; excluded so it cannot dilute the aggregate.
  - register_clustering
  - register_clustering_hdbscan
  - register_clustering_agglomerative
  - instruction_same_subject_diff_form
  - instruction_same_form_diff_subject
  - instruction_same_topic_diff_subject
  - instruction_same_audience_diff_register
  weights:
    retrieval: 0.3
    classification: 0.25
    clustering: 0.2
    pair_classification: 0.25
  metrics:
    retrieval: ndcg@10
    classification: macro_f1
    clustering: v_measure
    pair_classification: f1
