[project]
name = "shelf"
version = "0.1.0"
description = "SHELF: Synthetic Harness for Evaluating LLM Fitness - A benchmark using Library of Congress taxonomies"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=3.0.0",
    "httpx>=0.28.1",
    "huggingface-hub>=0.25.0",
    "ipython>=9.8.0",
    "lxml>=6.0.2",
    "numpy>=1.26.0",
    "orjson>=3.10.0",
    "pydantic>=2.12.5",
    "pydantic-ai>=1.29.0",
    "pymarc>=5.2.0",
    "rdflib>=7.0.0",
    "rich>=13.0.0",
    "scikit-learn>=1.5.0",
    "tokenizers>=0.22.1",
    "transformers>=4.57.3",
    "typer>=0.12.0",
]

[project.scripts]
shelf = "shelf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
